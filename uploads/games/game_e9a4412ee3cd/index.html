<!DOCTYPE html>
<html>
<head>
  <title>Mandelbrot Fun!</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      background-color: #222;
      color: white;
    }
    canvas {
      border: 1px solid #555;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      align-items: center;
    }
    .controls label {
      margin-right: 10px;
    }
    .controls input[type="range"] {
      width: 300px;
    }
  </style>
</head>
<body>

  <canvas id="mandelbrotCanvas" width="600" height="600"></canvas>

  <div class="controls">
    <label for="iterationsSlider">Iterations:</label>
    <input type="range" id="iterationsSlider" min="1" max="1000" value="100">
    <span id="iterationsValue">100</span>
  </div>

  <script>
    function drawMandelbrot(canvas, iterations, zoom, panX, panY) {
      const ctx = canvas.getContext("2d");
      const width = canvas.width;
      const height = canvas.height;
      const imageData = ctx.createImageData(width, height);
      const data = imageData.data;

      for (let x = 0; x < width; x++) {
        for (let y = 0; y < height; y++) {
          let zx = (x - width / 2) / (zoom * width / 4) + panX;
          let zy = (y - height / 2) / (zoom * height / 4) + panY;
          let cx = zx;
          let cy = zy;
          let i = 0;

          for (i = 0; i < iterations; i++) {
            const tempZx = zx * zx - zy * zy + cx;
            zy = 2 * zx * zy + cy;
            zx = tempZx;

            if (zx * zx + zy * zy > 4) {
              break;
            }
          }

          const pixelIndex = (y * width + x) * 4;

          if (i === iterations) {
            data[pixelIndex] = 0;
            data[pixelIndex + 1] = 0;
            data[pixelIndex + 2] = 0;
            data[pixelIndex + 3] = 255;
          } else {
            const color = (i / iterations) * 255;
            data[pixelIndex] = color;
            data[pixelIndex + 1] = color;
            data[pixelIndex + 2] = 255 - color;
            data[pixelIndex + 3] = 255;
          }
        }
      }

      ctx.putImageData(imageData, 0, 0);
    }

    function initMandelbrot(canvasId) {
      const canvas = document.getElementById(canvasId);
      let iterations = parseInt(document.getElementById("iterationsSlider").value);
      let zoom = 1;
      let panX = 0;
      let panY = 0;

      function redraw() {
        iterations = parseInt(document.getElementById("iterationsSlider").value);
        document.getElementById("iterationsValue").textContent = iterations;
        drawMandelbrot(canvas, iterations, zoom, panX, panY);
      }

      redraw();

      canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
        zoom *= zoomFactor;
        redraw();
      });

      let isDragging = false;
      let dragStartX, dragStartY;

      canvas.addEventListener("mousedown", (e) => {
        isDragging = true;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
      });

      canvas.addEventListener("mousemove", (e) => {
        if (isDragging) {
          panX += (dragStartX - e.clientX) / (zoom * canvas.width / 4);
          panY += (dragStartY - e.clientY) / (zoom * canvas.height / 4);
          dragStartX = e.clientX;
          dragStartY = e.clientY;
          redraw();
        }
      });

      canvas.addEventListener("mouseup", () => {
        isDragging = false;
      });

      canvas.addEventListener("mouseleave", () => {
          isDragging = false;
      })

      document.getElementById("iterationsSlider").addEventListener("input", redraw);

    }

    initMandelbrot("mandelbrotCanvas");
  </script>

</body>
</html>
