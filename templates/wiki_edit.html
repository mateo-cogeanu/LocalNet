{% extends "base.html" %}
{% block title %}{% if art.body %}Edit{% else %}New{% endif %} Article — Wiki{% endblock %}
{% block body %}
<div class="wrap" style="max-width:800px">
  <div class="page-header">
    <h1>{% if art.body %}Edit{% else %}New{% endif %} Article</h1>
    <a href="/wiki" class="btn btn-ghost">Cancel</a>
  </div>
  <div class="inset">
    <form method="post">
      <div class="form-group">
        <label>Title</label>
        <input type="text" name="title" value="{{ art.title }}" required autofocus>
      </div>
      <div class="form-group">
        <label>Body</label>
        <textarea name="body" style="min-height:320px;font-family:var(--mono);font-size:.87rem">{{ art.body }}</textarea>
      </div>
      <button class="btn btn-accent" type="submit">Save Article</button>
    </form>
  </div>
</div>
{% endblock %}
