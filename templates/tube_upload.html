{% extends "base.html" %}
{% block title %}Upload Video — Tube{% endblock %}
{% block body %}
<div class="wrap" style="max-width:680px">
  <div class="page-header">
    <h1>Upload Video</h1>
    <a href="/tube" class="btn btn-ghost">Back</a>
  </div>
  {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
  <div class="inset">
    <form method="post" enctype="multipart/form-data">
      <div class="form-group">
        <label>Title</label>
        <input type="text" name="title" required autofocus placeholder="Video title">
      </div>
      <div class="form-group">
        <label>Description <span style="color:var(--text2)">(optional)</span></label>
        <textarea name="desc" placeholder="What's this video about?"></textarea>
      </div>
      <div class="form-group">
        <label>Video file <span style="color:var(--text2)">(MP4, WebM, OGV)</span></label>
        <div class="file-drop">
          <input type="file" name="video" id="vid-in" accept="video/*" required>
          Click or drag & drop
        </div>
        <div class="file-name" id="vid-name"></div>
      </div>
      <div class="form-group">
        <label>Thumbnail <span style="color:var(--text2)">(optional)</span></label>
        <div class="file-drop">
          <input type="file" name="thumbnail" id="thumb-in" accept="image/*">
          Click or drag & drop image
        </div>
        <div class="file-preview" id="thumb-prev"><img src=""></div>
        <div class="file-name" id="thumb-name"></div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-accent" type="submit">Upload</button>
        <a href="/tube" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  initDrop('thumb-in','thumb-prev','thumb-name');
  document.getElementById('vid-in').addEventListener('change', function(){
    document.getElementById('vid-name').textContent = this.files[0]?.name || '';
  });
});
</script>
{% endblock %}
