{% extends "base.html" %}
{% block title %}New Paste — Paste{% endblock %}
{% block body %}
<div class="wrap" style="max-width:820px">
  <div class="page-header">
    <h1>New Paste</h1>
    <a href="/paste" class="btn btn-ghost">Back</a>
  </div>
  {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
  <div class="inset">
    <form method="post">
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div class="form-group" style="flex:2;min-width:200px">
          <label>Title <span style="color:var(--text2)">(optional)</span></label>
          <input type="text" name="title" placeholder="My snippet…" autofocus>
        </div>
        <div class="form-group" style="flex:1;min-width:130px">
          <label>Language</label>
          <select name="lang">
            <option value="text">Plain text</option>
            <option value="python">Python</option>
            <option value="javascript">JavaScript</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="bash">Bash</option>
            <option value="c">C / C++</option>
            <option value="json">JSON</option>
            <option value="sql">SQL</option>
            <option value="markdown">Markdown</option>
          </select>
        </div>
        <div class="form-group" style="flex:1;min-width:130px">
          <label>Expires</label>
          <select name="expires">
            <option value="never">Never</option>
            <option value="1h">1 hour</option>
            <option value="24h">24 hours</option>
            <option value="7d">7 days</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Content</label>
        <textarea name="body" style="min-height:340px;font-family:var(--mono);font-size:.87rem" placeholder="Paste your code here…" required></textarea>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-accent" type="submit">Create Paste</button>
        <a href="/paste" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
