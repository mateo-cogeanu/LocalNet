<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}⟨LocalNet⟩{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/main.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
{% block nav %}
<nav>
  <a href="/" class="brand">⟨LocalNet⟩</a>
  <div class="nav-sep"></div>
  <div class="nav-links">

    <!-- Home -->
    <a href="/" {% if request.path == '/' %}class="active"{% endif %}>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>

    <!-- Forums -->
    <a href="/forums" {% if 'forums' in request.path %}class="active"{% endif %}>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      Forums
    </a>

    <!-- Tube -->
    <a href="/tube" {% if 'tube' in request.path %}class="active"{% endif %}>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      Tube
    </a>

    <!-- Wiki -->
    <a href="/wiki" {% if 'wiki' in request.path %}class="active"{% endif %}>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
      Wiki
    </a>

    <!-- Paste -->
    <a href="/paste" {% if 'paste' in request.path %}class="active"{% endif %}>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
      Paste
    </a>

    <!-- Games -->
    <a href="/games" {% if 'games' in request.path %}class="active"{% endif %}>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4m-2-2v4M15 11h.01M17 13h.01"/></svg>
      Games
    </a>

    <!-- Chat -->
    <a href="/chat" {% if 'chat' in request.path %}class="active"{% endif %}>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="13" y2="13"/></svg>
      Chat
    </a>

  </div>
  <div class="nav-right">
    <span class="user-chip">
      {% if current_profile.pfp_url %}
      <img src="{{ current_profile.pfp_url }}" alt="{{ user }}" class="chip-avatar">
      {% else %}
      <span class="chip-avatar chip-avatar-fallback">{{ user[0].upper() }}</span>
      {% endif %}
      <span>{{ user }}</span>
    </span>
    <a href="/settings" class="btn btn-ghost btn-sm nav-icon-btn" title="Settings">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3"/><path d="M12 18v3"/><path d="M3 12h3"/><path d="M18 12h3"/><path d="M5.64 5.64l2.12 2.12"/><path d="M16.24 16.24l2.12 2.12"/><path d="M5.64 18.36l2.12-2.12"/><path d="M16.24 7.76l2.12-2.12"/><circle cx="12" cy="12" r="3.5"/></svg>
    </a>
    <a href="/logout" class="btn btn-ghost btn-sm" title="Sign out">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign out
    </a>
  </div>
</nav>
{% endblock %}

<div id="toast" class="toast"></div>
<div id="lightbox" onclick="this.classList.remove('open')"><img id="lb-img" src=""></div>

{% block body %}{% endblock %}
</body>
</html>
