{% extends "base.html" %}
{% block title %}{{ art.title }} — Wiki{% endblock %}
{% block body %}
<div class="wrap" style="max-width:820px">
  <div class="page-header">
    <h1>{{ art.title }}</h1>
    <a href="/wiki/{{ slug }}/edit" class="btn btn-ghost">Edit</a>
  </div>
  <p class="meta">Last edited by <strong>{{ art.author }}</strong> &nbsp;{{ art.ts }}</p>
  <hr>
  <div class="wiki-body">{{ art_html|safe }}</div>
  <a href="/wiki" class="meta" style="display:inline-block;margin-top:24px">← All Articles</a>
</div>
{% endblock %}
